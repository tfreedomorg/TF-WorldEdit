plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    // Shadow 8.1.1 works with Java 21 when there are no implementation dependencies
    // For future: com.gradleup.shadow 9.0.1+ available (requires Gradle 8.11+)
}

group = 'me.totalfreedom'
version = '2.0.0'
sourceCompatibility = '21'
targetCompatibility = '21'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'enginehub'
        url = 'https://maven.enginehub.org/repo/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.10-R0.1-SNAPSHOT'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.3.10'
    compileOnly 'com.sk89q.worldedit:worldedit-core:7.3.10'
}

shadowJar {
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Currently using regular jar since we have no implementation dependencies to bundle
// The plugin uses compileOnly dependencies, so WorldEdit must be installed on the server
// If you need to bundle dependencies in the future, test shadowJar task with Java 21
build.dependsOn jar

